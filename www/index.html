<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ZUDAN's Audio Player</title>

<!-- Fonts: Space Grotesk for brand/headings, Inter for body, JetBrains Mono for time/track-number readouts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- Tailwind CSS (utility classes for layout/spacing only — visual identity lives in style.css) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* =========================================================================
   ZUDAN's Audio Player — Theme: Black & Green (cyberpunk / matrix aesthetic)
   Token system
   ========================================================================= */
:root {
  --zd-black: #000000;
  --zd-charcoal: #121212;
  --zd-charcoal-raised: #181818;
  --zd-border: #232323;

  --zd-neon: #39ff14;
  --zd-emerald: #1db954;
  --zd-neon-dim: #1a5c0c;

  --zd-text-primary: #ffffff;
  --zd-text-secondary: #a7a7a7;
  --zd-text-muted: #6b6b6b;

  --zd-radius-sm: 6px;
  --zd-radius-md: 10px;
  --zd-radius-lg: 16px;

  --zd-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --zd-fast: 0.3s;

  --zd-sidebar-w: 300px;
  --zd-header-h: 64px;
  --zd-controlbar-h: 92px;
  --zd-seekbar-h: 34px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overscroll-behavior: none;
}

.zd-body {
  background: var(--zd-black);
  color: var(--zd-text-primary);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

::selection { background: var(--zd-neon-dim); color: var(--zd-neon); }

/* Custom scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--zd-neon-dim); }

button { font-family: inherit; cursor: pointer; }

/* =========================================================================
   HEADER
   ========================================================================= */
.zd-header {
  height: var(--zd-header-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--zd-black);
  border-bottom: 1px solid var(--zd-border);
  position: relative;
  z-index: 30;
}

.zd-logo { display: flex; align-items: center; gap: 10px; }

.zd-logo-mark {
  width: 34px;
  height: 34px;
  border-radius: var(--zd-radius-sm);
  background: linear-gradient(160deg, var(--zd-neon), var(--zd-emerald));
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 18px;
  box-shadow: 0 0 18px rgba(57, 255, 20, 0.45);
}

.zd-logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.01em;
}

.zd-logo-accent { color: var(--zd-neon); }

.zd-track-counter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--zd-text-muted);
  margin-right: 6px;
  display: none;
}
@media (min-width: 640px) { .zd-track-counter { display: inline; } }

.zd-btn-outline {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--zd-neon);
  color: var(--zd-neon);
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  transition: background var(--zd-fast) var(--zd-ease), box-shadow var(--zd-fast) var(--zd-ease), color var(--zd-fast) var(--zd-ease);
}
.zd-btn-outline:hover {
  background: rgba(57, 255, 20, 0.08);
  box-shadow: 0 0 14px rgba(57, 255, 20, 0.35);
}
.zd-btn-outline:active { transform: scale(0.97); }

.zd-icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--zd-text-secondary);
  transition: color var(--zd-fast) var(--zd-ease), background var(--zd-fast) var(--zd-ease);
  position: relative;
}
.zd-icon-btn:hover { color: var(--zd-neon); background: rgba(255, 255, 255, 0.05); }
.zd-icon-btn.is-active { color: var(--zd-neon); text-shadow: 0 0 10px rgba(57,255,20,0.6); }
.zd-icon-btn--md { width: 46px; height: 46px; color: var(--zd-text-primary); }

/* =========================================================================
   BODY GRID (sidebar + main)
   ========================================================================= */
.zd-body-grid {
  flex: 1;
  display: grid;
  grid-template-columns: var(--zd-sidebar-w) 1fr;
  min-height: 0;
}
@media (max-width: 900px) {
  .zd-body-grid { grid-template-columns: 1fr; }
}

/* =========================================================================
   SIDEBAR / QUEUE
   ========================================================================= */
.zd-sidebar {
  background: var(--zd-charcoal);
  border-right: 1px solid var(--zd-border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 18px 14px;
  gap: 14px;
}

@media (max-width: 900px) {
  .zd-sidebar {
    position: fixed;
    top: var(--zd-header-h);
    left: 0;
    bottom: 0;
    width: min(84vw, 320px);
    z-index: 40;
    transform: translateX(-100%);
    transition: transform var(--zd-fast) var(--zd-ease);
    box-shadow: 20px 0 40px rgba(0,0,0,0.5);
  }
  .zd-sidebar.is-open { transform: translateX(0); }
}

.zd-sidebar-scrim {
  display: none;
  position: fixed;
  inset: var(--zd-header-h) 0 0 0;
  background: rgba(0,0,0,0.6);
  z-index: 35;
}
.zd-sidebar-scrim.is-open { display: block; }

.zd-sidebar-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
.zd-sidebar-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; margin: 0; }
.zd-muted { color: var(--zd-text-muted); font-size: 12px; }
.zd-small { font-size: 11px; }

.zd-dropzone {
  border: 1.5px dashed #2c2c2c;
  border-radius: var(--zd-radius-md);
  padding: 22px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--zd-text-muted);
  text-align: center;
  transition: border-color var(--zd-fast) var(--zd-ease), background var(--zd-fast) var(--zd-ease), color var(--zd-fast) var(--zd-ease);
  flex-shrink: 0;
}
.zd-dropzone p { margin: 4px 0 0; font-size: 13px; color: var(--zd-text-secondary); }
.zd-dropzone.is-dragover {
  border-color: var(--zd-neon);
  color: var(--zd-neon);
  background: rgba(57, 255, 20, 0.06);
}

.zd-scan-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--zd-neon);
  text-align: center;
  margin: 0;
  flex-shrink: 0;
}

.zd-btn-outline--solid {
  background: rgba(57, 255, 20, 0.1);
}

.zd-playlist {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.zd-track {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--zd-radius-sm);
  transition: background var(--zd-fast) var(--zd-ease);
  position: relative;
}
.zd-track:hover { background: rgba(255,255,255,0.04); }
.zd-track.is-active { background: rgba(57, 255, 20, 0.08); }

.zd-track-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--zd-text-muted);
  width: 18px;
  flex-shrink: 0;
  text-align: center;
}
.zd-track.is-active .zd-track-num { color: var(--zd-neon); }

.zd-track-eq {
  width: 18px;
  height: 14px;
  display: none;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  flex-shrink: 0;
}
.zd-track.is-active .zd-track-eq { display: flex; }
.zd-track.is-active .zd-track-num { display: none; }
.zd-track-eq span {
  width: 3px;
  background: var(--zd-neon);
  border-radius: 1px;
  animation: zd-eq-bounce 0.9s ease-in-out infinite;
}
.zd-track-eq span:nth-child(1) { animation-delay: -0.6s; height: 40%; }
.zd-track-eq span:nth-child(2) { animation-delay: -0.3s; height: 90%; }
.zd-track-eq span:nth-child(3) { animation-delay: 0s; height: 60%; }
@keyframes zd-eq-bounce { 0%,100% { height: 20%; } 50% { height: 100%; } }

.zd-track-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.zd-track-title { font-size: 13px; color: var(--zd-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zd-track.is-active .zd-track-title { color: var(--zd-neon); }
.zd-track-sub { font-size: 11px; color: var(--zd-text-muted); }

.zd-track-remove {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--zd-text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity var(--zd-fast) var(--zd-ease), color var(--zd-fast) var(--zd-ease);
}
.zd-track:hover .zd-track-remove { opacity: 1; }
.zd-track-remove:hover { color: #ff4d4d; }

.zd-empty-state {
  display: none;
  color: var(--zd-text-muted);
  font-size: 12.5px;
  line-height: 1.6;
  text-align: center;
  padding: 20px 8px;
}
.zd-empty-state.is-visible { display: block; }

/* =========================================================================
   MAIN PLAYER AREA
   ========================================================================= */
.zd-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
}

.zd-gesture-surface {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(29, 185, 84, 0.08), transparent 60%),
    var(--zd-black);
  user-select: none;
}

.zd-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(70vw, 340px);
  height: min(70vw, 340px);
}

/* Rotating disc */
.zd-disc-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.zd-disc {
  width: 78%;
  height: 78%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 60%, #000 100%);
  border: 1px solid #262626;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 0 40px rgba(57, 255, 20, 0.12), inset 0 0 30px rgba(0,0,0,0.8);
  animation: zd-spin 9s linear infinite;
  animation-play-state: paused;
}
.zd-disc.is-spinning { animation-play-state: running; }
@keyframes zd-spin { to { transform: rotate(360deg); } }

.zd-disc-groove {
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  border: 1px solid #1c1c1c;
}
.zd-disc-groove--2 { inset: 26%; }

.zd-disc-label {
  width: 34%;
  height: 34%;
  border-radius: 50%;
  background: linear-gradient(155deg, var(--zd-neon), var(--zd-emerald));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 24px rgba(57, 255, 20, 0.5);
  z-index: 2;
}
.zd-disc-label span {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: #000;
}

.zd-disc-arm {
  position: absolute;
  top: 6%;
  right: 4%;
  width: 4px;
  height: 34%;
  background: linear-gradient(#3a3a3a, #1a1a1a);
  border-radius: 4px;
  transform-origin: top center;
  transform: rotate(-22deg);
  transition: transform var(--zd-fast) var(--zd-ease);
  box-shadow: -1px 0 6px rgba(0,0,0,0.6);
}
.zd-disc-arm::before {
  content: '';
  position: absolute;
  top: -4px;
  left: -4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #2c2c2c;
  border: 2px solid #444;
}
.zd-gesture-surface.is-playing .zd-disc-arm { transform: rotate(-2deg); }

/* Canvas visualizer ring, layered behind/around the disc */
.zd-visualizer {
  position: absolute;
  inset: -6%;
  width: 112%;
  height: 112%;
  pointer-events: none;
}

.zd-now-playing {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 22px;
  text-align: center;
  padding: 0 24px;
  pointer-events: none;
}
.zd-now-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.zd-now-meta {
  font-size: 12px;
  color: var(--zd-text-muted);
  margin: 0;
}

/* Gesture feedback overlays */
.zd-gesture-overlay {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 12px;
  border-radius: var(--zd-radius-lg);
  background: rgba(10, 10, 10, 0.85);
  border: 1px solid rgba(57, 255, 20, 0.35);
  color: var(--zd-neon);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s var(--zd-ease);
  z-index: 5;
  backdrop-filter: blur(6px);
}
.zd-gesture-overlay.is-visible { opacity: 1; }
.zd-gesture-overlay--left { left: 18px; }
.zd-gesture-overlay--right { right: 18px; }
.zd-gesture-overlay--center {
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
}

.zd-gesture-track {
  width: 5px;
  height: 90px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.zd-gesture-fill {
  width: 100%;
  background: linear-gradient(var(--zd-neon), var(--zd-emerald));
  border-radius: 4px;
  height: 70%;
  box-shadow: 0 0 10px rgba(57,255,20,0.6);
  transition: height 0.08s linear;
}
.zd-gesture-overlay span:last-child {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

/* =========================================================================
   SEEK BAR
   ========================================================================= */
.zd-seekbar-row {
  height: var(--zd-seekbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
}

.zd-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--zd-text-muted);
  width: 38px;
  flex-shrink: 0;
}
.zd-time:last-child { text-align: right; }

.zd-seekbar {
  position: relative;
  flex: 1;
  height: 18px;
  display: flex;
  align-items: center;
  cursor: pointer;
}
.zd-seekbar::before {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 4px;
  border-radius: 4px;
  background: #232323;
}
.zd-seekbar-buffered, .zd-seekbar-progress {
  position: absolute;
  left: 0;
  height: 4px;
  border-radius: 4px;
  pointer-events: none;
}
.zd-seekbar-buffered { background: #333; width: 0%; }
.zd-seekbar-progress {
  background: linear-gradient(90deg, var(--zd-emerald), var(--zd-neon));
  width: 0%;
  box-shadow: 0 0 8px rgba(57,255,20,0.5);
}
.zd-seekbar-handle {
  position: absolute;
  left: 0%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--zd-neon);
  box-shadow: 0 0 10px rgba(57,255,20,0.8);
  transform: translateX(-50%);
  transition: transform 0.15s var(--zd-ease);
}
.zd-seekbar:hover .zd-seekbar-handle { transform: translateX(-50%) scale(1.25); }

/* =========================================================================
   BOTTOM CONTROL BAR
   ========================================================================= */
.zd-controlbar {
  height: var(--zd-controlbar-h);
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 20px 10px;
  gap: 8px;
}

.zd-controlbar-group { display: flex; align-items: center; gap: 6px; }
.zd-controlbar-group--left { justify-content: flex-start; }
.zd-controlbar-group--center { justify-content: center; gap: 14px; }
.zd-controlbar-group--right { justify-content: flex-end; }

.zd-play-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(155deg, var(--zd-neon), var(--zd-emerald));
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 22px rgba(57, 255, 20, 0.45);
  transition: transform var(--zd-fast) var(--zd-ease), box-shadow var(--zd-fast) var(--zd-ease);
}
.zd-play-btn svg { margin-left: 2px; }
.zd-play-btn:hover { box-shadow: 0 0 30px rgba(57, 255, 20, 0.65); }
.zd-play-btn:active { transform: scale(0.94); }

.zd-repeat-dot {
  position: absolute;
  bottom: 6px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--zd-neon);
  box-shadow: 0 0 6px rgba(57,255,20,0.9);
}

.zd-speed-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--zd-text-secondary);
  border: 1px solid var(--zd-border);
  border-radius: 999px;
  padding: 6px 12px;
}

/* =========================================================================
   EQUALIZER PANEL
   ========================================================================= */
.zd-eq-scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 45;
}
.zd-eq-scrim.is-open { display: block; }

.zd-eq-panel {
  position: fixed;
  left: 50%;
  bottom: -100%;
  transform: translateX(-50%);
  width: min(92vw, 420px);
  background: var(--zd-charcoal-raised);
  border: 1px solid var(--zd-border);
  border-radius: var(--zd-radius-lg) var(--zd-radius-lg) 0 0;
  padding: 18px 20px 26px;
  z-index: 50;
  transition: bottom var(--zd-fast) var(--zd-ease);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}
.zd-eq-panel.is-open { bottom: 0; }

.zd-eq-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.zd-eq-head h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; margin: 0; }

.zd-eq-presets { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.zd-eq-preset-btn {
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--zd-border);
  background: transparent;
  color: var(--zd-text-secondary);
  font-size: 12.5px;
  transition: all var(--zd-fast) var(--zd-ease);
}
.zd-eq-preset-btn.is-active {
  border-color: var(--zd-neon);
  color: var(--zd-neon);
  background: rgba(57,255,20,0.08);
  box-shadow: 0 0 10px rgba(57,255,20,0.3);
}

.zd-eq-bands { display: flex; justify-content: space-between; gap: 10px; height: 140px; }
.zd-eq-band { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
.zd-eq-band input[type="range"] {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 4px;
  height: 100px;
  accent-color: var(--zd-neon);
  background: transparent;
}
.zd-eq-band-label { font-size: 10px; color: var(--zd-text-muted); font-family: 'JetBrains Mono', monospace; }

/* =========================================================================
   RESPONSIVE / ACCESSIBILITY
   ========================================================================= */
@media (max-width: 520px) {
  .zd-header { padding: 0 12px; }
  .zd-seekbar-row, .zd-controlbar { padding-left: 12px; padding-right: 12px; }
  .zd-gesture-overlay--left { left: 8px; }
  .zd-gesture-overlay--right { right: 8px; }
}

:focus-visible {
  outline: 2px solid var(--zd-neon);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .zd-disc, .zd-track-eq span { animation: none !important; }
  * { transition-duration: 0.01ms !important; }
}

  </style>
</head>
<body class="zd-body">

  <!-- ============================= HEADER ============================= -->
  <header class="zd-header">
    <div class="flex items-center gap-3">
      <button id="drawerToggle" class="zd-icon-btn md:hidden" aria-label="Toggle queue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line
