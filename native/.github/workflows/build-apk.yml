name: Build ZUDAN'S Audio Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Init npm + install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Capacitor init
        run: npx cap init "ZUDAN Player" "com.zudan.player" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Copy native MediaScanner plugin into the generated project
        run: |
          mkdir -p android/app/src/main/java/com/zudan/player
          cp native/java/com/zudan/player/MediaScannerPlugin.java \
             android/app/src/main/java/com/zudan/player/MediaScannerPlugin.java

      - name: Register plugin in MainActivity
        run: |
          cat > android/app/src/main/java/com/zudan/player/MainActivity.java << 'EOF'
          package com.zudan.player;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaScannerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Merge permissions into AndroidManifest.xml
        run: |
          python3 - << 'EOF'
          import re
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open("native/AndroidManifest.permissions.xml") as f:
              perms = f.read()
          # strip the leading XML comment block from the permissions file
          perms = re.sub(r"<!--.*?-->", "", perms, flags=re.S).strip()
          with open(manifest_path) as f:
              manifest = f.read()
          manifest = manifest.replace("<application", perms + "\n\n    <application", 1)
          with open(manifest_path, "w") as f:
              f.write(manifest)
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zudan-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
